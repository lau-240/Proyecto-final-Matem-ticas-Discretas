# Configuración de la interfaz (sí se sube a GitHub; las claves van en secrets.toml)
[client]
# Oculta el botón "Deploy" y las opciones de desarrollador de la barra superior
toolbarMode = "viewer"

# Tema: se respeta el modo claro/oscuro del sistema y cada uno tiene su paleta.
# Fuentes de Google Fonts; sin internet se usan Georgia y la fuente sans del sistema.
[theme]
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap, Georgia, serif"
baseRadius = "medium"
buttonRadius = "medium"

[theme.light]
primaryColor = "#D2491F"
backgroundColor = "#FBF8F3"
secondaryBackgroundColor = "#F1ECE3"
textColor = "#1B2B44"
borderColor = "#E3DCCF"

[theme.dark]
primaryColor = "#F2875A"
backgroundColor = "#141A24"
secondaryBackgroundColor = "#1E2633"
textColor = "#EEE8DC"
borderColor = "#2C3646"
