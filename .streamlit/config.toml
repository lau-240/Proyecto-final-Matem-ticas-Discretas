# Configuración de la interfaz (sí se sube a GitHub; las claves van en secrets.toml)
[client]
# Oculta el botón "Deploy" y las opciones de desarrollador de la barra superior
toolbarMode = "viewer"

# Tema claro con la paleta institucional de Uninorte (rojo, negro, amarillo roble).
# Fuente de Google Fonts; sin internet se usa Arial.
[theme]
base = "light"
font = "Open Sans:https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap, Arial, sans-serif"
primaryColor = "#C8102E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F4"
textColor = "#1A1A1A"
borderColor = "#E2E2E2"
linkColor = "#C8102E"
baseRadius = "2px"
buttonRadius = "2px"
